<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本 · 立体速览</title>
<style>
  :root{
    --paper:#F4EFE6; --ink:#2A2620; --sub:#7A7264; --accent:#C2402F;
    --line:#DDD3C0; --card:#FFFDF8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(1200px 700px at 70% 20%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
      var(--paper);
    color:var(--ink);
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #scene.dragging{cursor:grabbing}
  #scene.point{cursor:pointer}

  .serif{font-family:Georgia,'Songti SC','STSong','SimSun',serif}

  /* ---------- 左上标题 ---------- */
  #hd{position:absolute;top:30px;left:36px;z-index:10;pointer-events:none;
      opacity:0;transform:translateY(-10px);transition:opacity .9s ease .3s,transform .9s ease .3s}
  body.ready #hd{opacity:1;transform:none}
  #hd h1{font-size:42px;font-weight:600;letter-spacing:.14em;line-height:1.15}
  #hd h1 em{font-style:normal;color:var(--accent)}
  #hd .sub{margin-top:10px;font-size:13px;color:var(--sub);letter-spacing:.06em}
  #hd .hint{margin-top:6px;font-size:12px;color:#A79C87;letter-spacing:.04em}
  #hd .rule{width:52px;height:2px;background:var(--accent);margin-top:14px}

  /* ---------- 右侧信息卡 ---------- */
  #card{position:absolute;top:50%;right:30px;z-index:11;width:308px;
        background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:24px 24px 20px;box-shadow:0 24px 60px rgba(70,58,36,.14);
        transform:translate(130%,-50%);transition:transform .5s cubic-bezier(.22,1,.32,1);
        pointer-events:none}
  #card.open{transform:translate(0,-50%);pointer-events:auto}
  #card .tag{display:inline-block;font-size:11px;letter-spacing:.22em;color:var(--accent);
             border:1px solid rgba(194,64,47,.45);border-radius:99px;padding:3px 10px 2px;margin-bottom:12px}
  #card h2{font-size:30px;font-weight:600;letter-spacing:.08em;line-height:1.1}
  #card .en{font-size:11px;letter-spacing:.3em;color:#B3A78E;margin:6px 0 12px}
  #card .tg{font-size:13px;color:var(--accent);letter-spacing:.04em;margin-bottom:10px}
  #card .desc{font-size:12.5px;line-height:1.85;color:#4E463A}
  #card .tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
  #card .tags span{font-size:11px;color:#6B6152;background:#F3EDDF;border-radius:6px;padding:4px 8px}
  #card .season{margin-top:14px;padding-top:12px;border-top:1px dashed #E4DAC6;
                font-size:12px;color:var(--sub)}
  #card .season b{color:var(--ink);font-weight:500}
  #card .x{position:absolute;top:14px;right:14px;width:26px;height:26px;border:none;border-radius:50%;
           background:transparent;color:#B9AE99;font-size:15px;cursor:pointer;line-height:1}
  #card .x:hover{color:var(--ink)}
  #card .tripnote{margin-top:12px;font-size:11.5px;color:var(--accent);
                  background:rgba(194,64,47,.07);border-radius:8px;padding:8px 10px;display:none}
  #card.istrip .tripnote{display:block}

  /* ---------- 左下地区按钮 ---------- */
  #chips{position:absolute;left:36px;bottom:28px;z-index:10;display:flex;flex-wrap:wrap;gap:8px;
         max-width:62vw;opacity:0;transition:opacity .8s ease .9s}
  body.ready #chips{opacity:1}
  .chip{font-size:12px;letter-spacing:.08em;color:#5C5344;background:rgba(255,253,248,.85);
        border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;
        transition:border-color .2s,color .2s,transform .2s}
  .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#FFF7EE}

  /* ---------- 右下行程开关 ---------- */
  #mode{position:absolute;right:30px;bottom:28px;z-index:10;display:flex;align-items:center;gap:12px;
        opacity:0;transition:opacity .8s ease 1.1s}
  body.ready #mode{opacity:1}
  #mode .lb{font-size:12px;color:var(--sub);letter-spacing:.05em;text-align:right;line-height:1.5}
  #mode .lb b{display:block;color:var(--ink);font-weight:500}
  #sw{width:46px;height:26px;border-radius:99px;border:1px solid var(--line);background:#EFE8D9;
      position:relative;cursor:pointer;transition:background .25s,border-color .25s}
  #sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
             background:#fff;box-shadow:0 2px 5px rgba(60,50,30,.25);transition:left .25s cubic-bezier(.4,0,.2,1)}
  #sw.on{background:var(--accent);border-color:var(--accent)}
  #sw.on::after{left:22px}
  #credit{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:10px;
          color:#B8AD97;letter-spacing:.12em;z-index:9}

  @media (max-width:900px){
    #hd h1{font-size:30px}
    #card{width:262px;right:16px;padding:18px}
    #chips{max-width:80vw;bottom:84px}
  }
</style>
</head>

const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
let W=0,H=0;
function geo(lon,lat){return {x:(lon-136.0)*1.02, z:(35.9-lat)*1.02};}

const cam={yaw:.42,pitch:.96,dist:30.5,tx:0,tz:0,cx:0,cy:0,f:1};
const camT={tx:0,tz:0,dist:30.5};
function resize(){
  const DPR=Math.min(window.devicePixelRatio||1,2);

  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cam.cx=W*.5;cam.cy=H*.5;cam.f=Math.min(W,H)*1.45;
}
window.addEventListener('resize',resize);resize();

  let sx=0,sz=0;r.polyW[0].forEach(p=>{sx+=p.x;sz+=p.z;});
  r.cx=sx/r.polyW[0].length;r.cz=sz/r.polyW[0].length;

const CX0=(minX+maxX)/2, CZ0=(minZ+maxZ)/2;
cam.tx=CX0;cam.tz=CZ0;camT.tx=CX0;camT.tz=CZ0;

function proj(x,y,z){
  const X=x-cam.tx, Z=z-cam.tz;
  const cyw=Math.cos(cam.yaw), syw=Math.sin(cam.yaw);
  const X1=X*cyw+Z*syw, Z1=-X*syw+Z*cyw;
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const Y2=y*cp-Z1*sp, Z2=y*sp+Z1*cp;
  const depth=cam.dist+Z2, s=cam.f/depth;
  return {x:cam.cx+X1*s, y:cam.cy-Y2*s, d:depth};
}
function pip(px,py,pts){
  let ins=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins;
  }
  return ins;
}
function shade(hex,k){

}
function polyPath(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawSea(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#D6E2EA');g.addColorStop(1,'#C2D4E0');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=1;
  for(let la=25;la<=45;la+=2.3){
    const z0=(35.9-la)*1.02;
    ctx.beginPath();let st=false;
    for(let x=-16;x<=14;x+=1.2){
      const z=z0+Math.sin(x*.7+t*.00045+la)*.14;
      const p=proj(x,0,z);
      if(p.d<2){st=false;continue;}
      if(!st){ctx.moveTo(p.x,p.y);st=true;}else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }
}
function drawShadows(){
  ctx.fillStyle='rgba(88,98,112,.15)';
  REGIONS.forEach(r=>{
    polyPath(r.polyW[0].map(p=>proj(p.x+.5,.02,p.z+.3)));
    ctx.fill();
    r.dotsW.forEach(d=>{const p=proj(d.x+.5,.02,d.z+.3);ctx.beginPath();ctx.arc(p.x,p.y,3.4,0,7);ctx.fill();});
  });
  const ok=REGIONS.find(r=>r.inset);
  if(ok){
    const pts=ok.polyW[0].map(p=>proj(p.x,ok.h,p.z));
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const x0=Math.min(...xs)-16,y0=Math.min(...ys)-14,w=Math.max(...xs)-x0+32,h=Math.max(...ys)-y0+40;

  }
}
const L=(()=>{const l=Math.hypot(-.62,-.4);return {x:-.62/l,z:-.4/l};})();

function drawRegion(r){
  const h=r.h+r.lift, yb=(1-r.pp)*6;
  const dim=state.sel&&state.sel!==r.id;
  const P=r.polyW[0];
  const sides=[];
  for(let i=0;i<P.length;i++){
    const a=P[i],b=P[(i+1)%P.length];
    const nx=b.z-a.z, nz=-(b.x-a.x), nl=Math.hypot(nx,nz)||1;
    const br=.58+.42*Math.abs((nx*L.x+nz*L.z)/nl);
    const mid=proj((a.x+b.x)/2,h/2+yb,(a.z+b.z)/2);
    sides.push({a,b,br,d:mid.d});
  }
  sides.sort((s1,s2)=>s2.d-s1.d);
  ctx.globalAlpha=r.pp*(dim?.38:1);
  sides.forEach(s=>{
    ctx.fillStyle=shade(r.color,s.br);
    ctx.beginPath();
    const pa=proj(s.a.x,h+yb,s.a.z), pb=proj(s.b.x,h+yb,s.b.z);
    const pa0=proj(s.a.x,yb,s.a.z), pb0=proj(s.b.x,yb,s.b.z);
    ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.lineTo(pb0.x,pb0.y);ctx.lineTo(pa0.x,pa0.y);
    ctx.closePath();ctx.fill();
  });
  const top=P.map(p=>proj(p.x,h+yb,p.z));
  r.projTop=top;
  ctx.fillStyle=r.color;
  polyPath(top);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();
  if(state.sel===r.id){
    ctx.strokeStyle='#8E2417';ctx.lineWidth=1.6;polyPath(top);ctx.stroke();
    ctx.strokeStyle='rgba(255,244,230,.5)';ctx.lineWidth=3.5;polyPath(top.map(p=>({x:p.x,y:p.y-2.2})));ctx.stroke();
  }
  r.dotsW.forEach(d=>{
    const p=proj(d.x,h+yb,d.z);
    ctx.fillStyle=r.color;
    ctx.beginPath();ctx.moveTo(p.x,p.y-4);ctx.lineTo(p.x+4,p.y);ctx.lineTo(p.x,p.y+4);ctx.lineTo(p.x-4,p.y);ctx.closePath();ctx.fill();
  });
  const lp=proj(r.lx,h+yb+.05,r.lz);
  if(lp.d>2&&!(state.itin&&r.trip)){
    ctx.font='600 13.5px Georgia,"Songti SC","SimSun",serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=r.pp*(dim?.55:1);
    ctx.lineWidth=3.5;ctx.strokeStyle='rgba(244,239,230,.9)';
    ctx.strokeText(r.name,lp.x,lp.y);
    ctx.fillStyle=state.sel===r.id?'#7E1D12':(dim?'#2A2620':'#2A2620');
    ctx.fillText(r.name,lp.x,lp.y);
  }
  ctx.globalAlpha=1;
}

function drawPins(t){
  if(!state.itin)return;
  const K=REGIONS.find(r=>r.id==='kansai');
  const items=PINS.map((pin,i)=>{
    const g=geo(pin.lon,pin.lat);
    const base=proj(g.x,K.h+K.lift+.04,g.z);
    const p=Math.min(1,Math.max(0,(t-state.pinT0-i*130)/450));
    return {pin,base,e:1-Math.pow(1-p,3)};
  }).filter(it=>it.e>0);
  ctx.strokeStyle='#C2402F';ctx.lineWidth=1.6;ctx.setLineDash([5,5]);ctx.lineDashOffset=-t*.02;
  ctx.beginPath();
  items.forEach((it,i)=>i?ctx.lineTo(it.base.x,it.base.y):ctx.moveTo(it.base.x,it.base.y));
  ctx.stroke();ctx.setLineDash([]);
  const colX=Math.max(...items.map(it=>it.base.x))+70;
  let colY=Math.min(...items.map(it=>it.base.y))-46;
  items.sort((a,b)=>a.base.y-b.base.y);
  items.forEach(it=>{
    const {pin,base,e}=it;
    ctx.globalAlpha=e;
    ctx.fillStyle='#FFF7EE';ctx.beginPath();ctx.arc(base.x,base.y,3.6,0,7);ctx.fill();
    ctx.strokeStyle='#C2402F';ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(base.x,base.y,3.6,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(194,64,47,.7)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(base.x,base.y-5);ctx.lineTo(base.x,colY);ctx.lineTo(colX-7,colY);ctx.stroke();
    ctx.font='700 11px "PingFang SC","Microsoft YaHei",sans-serif';
    const dW=ctx.measureText(pin.d).width;
    ctx.font='500 11px "PingFang SC","Microsoft YaHei",sans-serif';
    const rW=ctx.measureText(' '+pin.dt+'  '+pin.n).width;
    const w=dW+rW+20;
    roundRect(colX,colY-10.5,w,21,10.5);
    ctx.fillStyle='rgba(255,253,248,.97)';ctx.fill();
    ctx.strokeStyle='#C2402F';ctx.lineWidth=1;ctx.stroke();
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle='#C2402F';ctx.font='700 11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(pin.d,colX+10,colY+.5);
    ctx.fillStyle='#2A2620';ctx.font='500 11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(' '+pin.dt+'  '+pin.n,colX+10+dW,colY+.5);
    colY+=30;
    ctx.globalAlpha=1;
  });
}
function vignette(){
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.42,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(74,62,40,.10)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function frame(t){
  const el=t-t0;
  REGIONS.forEach(r=>{
    const p=Math.min(1,Math.max(0,(el-r.delay)/800));
    r.pp=1-Math.pow(1-p,3);
    const tl=state.sel===r.id?.34:(state.hov===r.id?.13:0);
    r.lift+=(tl-r.lift)*.14;
  });
  const selR=REGIONS.find(r=>r.id===state.sel);
  if(selR){camT.tx=selR.cx;camT.tz=selR.cz;camT.dist=22;}
  else{camT.tx=CX0;camT.tz=CZ0;camT.dist=30.5;}
  cam.tx+=(camT.tx-cam.tx)*.07;cam.tz+=(camT.tz-cam.tz)*.07;cam.dist+=(camT.dist-cam.dist)*.07;
  if(!state.interacted)cam.yaw+=.0011;

  ctx.clearRect(0,0,W,H);
  drawSea(t);
  drawShadows();
  [...REGIONS].sort((a,b)=>proj(b.cx,0,b.cz).d-proj(a.cx,0,a.cz).d).forEach(drawRegion);
  drawPins(t);
  vignette();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener('load',()=>document.body.classList.add('ready'));

/* ================= 交互 ================= */
function hitTest(mx,my){
  const sorted=[...REGIONS].sort((a,b)=>proj(a.cx,0,a.cz).d-proj(b.cx,0,b.cz).d);
  for(const r of sorted) if(r.projTop&&pip(mx,my,r.projTop))return r.id;
  return null;
}
const card=document.getElementById('card');
function fillCard(r){
  document.getElementById('cTag').textContent=r.trip?'地区 · 行程主场':'地区';
  document.getElementById('cName').textContent=r.name;
  document.getElementById('cEn').textContent=r.en;
  document.getElementById('cTg').textContent='「 '+r.tg+' 」';
  document.getElementById('cDesc').textContent=r.desc;
  document.getElementById('cTags').innerHTML=r.tags.map(t=>'<span>'+t+'</span>').join('');
  document.getElementById('cSeason').innerHTML='最佳季节　<b>'+r.season+'</b>';
}
function select(id){
  state.sel=id;state.interacted=true;
  const r=REGIONS.find(q=>q.id===id);
  fillCard(r);
  card.classList.add('open');
  card.classList.toggle('istrip',!!r.trip);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id));
}
function deselect(){
  state.sel=null;
  card.classList.remove('open');
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
}
let down=false,px=0,py=0,moved=0;
cv.addEventListener('pointerdown',e=>{
  down=true;moved=0;px=e.clientX;py=e.clientY;
  state.interacted=true;state.drag=false;
  cv.classList.add('dragging');cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(down){
    const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6){
      state.drag=true;
      cam.yaw+=dx*.0052;
      cam.pitch=Math.min(1.32,Math.max(.42,cam.pitch+dy*.004));
    }
  }else{
    const h=hitTest(e.clientX,e.clientY);
    state.hov=h;cv.classList.toggle('point',!!h);
  }
});
window.addEventListener('pointerup',e=>{
  if(down&&!state.drag){
    const h=hitTest(e.clientX,e.clientY);
    if(h)select(h);else if(state.sel)deselect();
  }
  down=false;state.drag=false;cv.classList.remove('dragging');
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();state.interacted=true;
  camT.dist=Math.min(44,Math.max(15,camT.dist*(1+e.deltaY*.001)));
},{passive:false});

const chipsEl=document.getElementById('chips');
REGIONS.forEach(r=>{
  const b=document.createElement('button');
  b.className='chip';b.textContent=r.name;b.dataset.id=r.id;
  b.addEventListener('click',()=>select(r.id));
  chipsEl.appendChild(b);
});
const sw=document.getElementById('sw');
sw.addEventListener('click',()=>{
  state.itin=!state.itin;
  sw.classList.toggle('on',state.itin);
  state.pinT0=performance.now();
  if(state.itin)select('kansai');
});
document.getElementById('cardX').addEventListener('click',deselect);
</script>
